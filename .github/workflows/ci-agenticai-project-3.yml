name: "CI · agenticai/project-3"

# Path-filtered: runs ONLY when this project's files change, so it never
# overlaps with any other project's CI.
on:
  push:
    paths:
      - 'agenticai/projects/project-3/**'
      - '.github/workflows/ci-agenticai-project-3.yml'
  pull_request:
    paths:
      - 'agenticai/projects/project-3/**'

# Per-project concurrency group: rapid pushes to THIS project supersede each
# other; other projects' workflows are unaffected and run in parallel.
concurrency:
  group: ci-agenticai-project-3-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
